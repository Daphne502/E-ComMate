services:
  redis:
    image: redis:7-alpine
    container_name: ecommate-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ecommate-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ecommate-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      ECOMMATE_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped